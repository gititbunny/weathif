<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Weathif — Climate Scenario Simulator
    </title>

    <meta
      name="description"
      content="Explore real environmental conditions, historical climate context, seasonal outlooks and hypothetical temperature and rainfall scenarios with Weathif."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Browser theme -->
    <meta
      name="theme-color"
      content="#183b2b"
    />

    <meta
      name="color-scheme"
      content="light"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/logo.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Weathif"
    />

    <meta
      property="og:title"
      content="Weathif — Climate Scenario Simulator"
    />

    <meta
      property="og:description"
      content="Explore local weather, climate memory, seasonal outlooks, ENSO, land and water conditions, and hypothetical climate scenarios."
    />

    <meta
      property="og:image"
      content="/images/climate-hero-poster.jpg"
    />

    <meta
      property="og:image:alt"
      content="Storm clouds over a landscape representing environmental and climate conditions"
    />

    <!-- Social sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Weathif — Climate Scenario Simulator"
    />

    <meta
      name="twitter:description"
      content="Explore environmental conditions and hypothetical climate scenarios through an interactive climate data experience."
    />

    <meta
      name="twitter:image"
      content="/images/climate-hero-poster.jpg"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
